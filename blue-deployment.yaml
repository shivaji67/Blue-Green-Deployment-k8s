apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-blue
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
      env: blue
  template:
    metadata:
      labels:
        app: myapp
        env: blue
    spec:
      containers:
      - name: myapp
        # Using Google's mirror to prevent Docker Hub pull rate-limits on Killercoda
        image: mirror.gcr.io/library/nginx:alpine
        ports:
        - containerPort: 80  # Standard Nginx port
